apiVersion: apps/v1
kind: Deployment
metadata:
  name: interview-frontend
  labels:
    app: interview-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interview-frontend
  template:
    metadata:
      labels:
        app: interview-frontend
    spec:
      containers:
        - name: interview-frontend-container
          image: maheshlamichhane123/interview-frontend:s1
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: interview-frontend
  labels:
    app: interview-frontend
spec:
  selector:
    app: interview-frontend
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 80
