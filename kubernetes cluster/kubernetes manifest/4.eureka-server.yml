apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  labels:
    app: eureka-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server-container
          image: maheshlamichhane123/eureka-server:s2
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: EUREKA_APPLICATION_NAME
---

apiVersion: v1
kind: Service
metadata:
  name: eureka-server
  labels:
    app: eureka-server
spec:
  selector:
    app: eureka-server
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 8083
      targetPort: 8083
