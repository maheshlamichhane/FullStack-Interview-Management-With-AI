apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification-container
          image: maheshlamichhane123/notification:s1
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: POSTGRES_INTERVIEW_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: POSTGRES_INTERVIEW_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: POSTGRES_INTERVIEW_PASSWORD
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: SPRING_PROFILES_ACTIVE
            - name: SPRING_CONFIG_IMPORT
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: SPRING_CONFIG_IMPORT
            - name: SPRING_RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: interview-configmap
                  key: RABBITMQ_HOST
---
apiVersion: v1
kind: Service
metadata:
  name: interview-backend
  labels:
    app: interview-backend
spec:
  selector:
    app: interview-backend
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 8086
      targetPort: 8086
