apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: interview-user-app
  namespace: prod
spec:
  hosts:
    - "interview-app.com"
  gateways:
    - interview-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: interview-frontend
            port:
              number: 4000
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 2s
