apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-mac-pv-dev
spec:
  capacity:
    storage: 3Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mac-hostpath
  hostPath:
    path: /Users/maheshlamichhane/volumes/db/dev
    type: DirectoryOrCreate
