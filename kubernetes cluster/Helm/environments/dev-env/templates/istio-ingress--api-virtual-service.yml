apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: interview-api
  namespace: dev
spec:
  hosts:
    - "api.interview-app.com"
  gateways:
    - interview-gateway
  http:
    - match:
        - uri:
            prefix: /api/interviews
      route:
        - destination:
            host: interview-backend
            port:
              number: 8080
      timeout: 60s
      retries:
        attempts: 2
        retryOn: "gateway-error,connect-failure,refused-stream"

    - match:
        - uri:
            prefix: /api/ai
      route:
        - destination:
            host: interview-ai-backend
            port:
              number: 8081
      timeout: 120s

    - match:
        - uri:
            prefix: /health
      route:
        - destination:
            host: interview-service
            port:
              number: 8080
