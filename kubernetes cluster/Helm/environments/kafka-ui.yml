apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 9080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: dev-kafka
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "dev-env-kafka:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 9080
      targetPort: 9080
