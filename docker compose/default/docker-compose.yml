version: '3.8'
services:
  postgresqldb:
    container_name: postgresqldb
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U default -d default" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - interview-network

  eurekaserver:
    image: "maheshlamichhane123/eureka-server:s1"
    container_name: eurekaserver-ms
    platform: linux/amd64
    ports:
      - "8084:8080"
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgresqldb:
        condition: service_healthy

    networks:
      - interview-network
    restart: unless-stopped

  interview:
    image: "maheshlamichhane123/interview-backend:s1"
    container_name: interview-backend-ms
    platform: linux/amd64
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgresqldb:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresqldb:5432/default"
      SPRING_DATASOURCE_USERNAME: default
      SPRING_DATASOURCE_PASSWORD: default
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8080/eureka/
    networks:
      - interview-network
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    ports:
      - "8082:8080"
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresqldb:5432/default
      KC_DB_USERNAME: default
      KC_DB_PASSWORD: default
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - postgresqldb
    networks:
      - interview-network

  gatewayserver:
    image: "maheshlamichhane123/gateway-server:s1"
    container_name: gateway-ms
    platform: linux/amd64
    ports:
      - "8083:8080"
    healthcheck:
      test: curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8080/eureka/
    networks:
      - interview-network

volumes:
  postgres_data:


networks:
  interview-network:
    driver: bridge
