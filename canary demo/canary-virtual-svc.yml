apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: interview-ai-backend-virtual-service
  namespace: dev
spec:
  hosts:
    - interview-ai-backend.dev.svc.cluster.local
  http:
    - route:
        - destination:
            host: interview-ai-backend.dev.svc.cluster.local
            subset: safe-group
          weight: 50
        - destination:
            host: interview-ai-backend.dev.svc.cluster.local
            subset: risky-group
          weight: 50
